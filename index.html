<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSH. - Ultra Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
        
        :root {
            --brand-primary: #3b82f6;
            --brand-secondary: #8b5cf6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020408;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            transition: background-color 0.5s ease;
        }

        .glass {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
        }

        .nav-link {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-link.active {
            color: white;
            background: rgba(59, 130, 246, 0.2);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 10px;
        }

        /* Hatalmas óra stílusa */
        .big-clock {
            font-size: clamp(5rem, 16vw, 20rem);
            font-weight: 200;
            line-height: 0.85;
            letter-spacing: -0.05em;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        .page-content {
            animation: fadeIn 0.6s ease-out;
            height: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid var(--brand-primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .main-container {
            height: calc(100vh - 140px);
            transition: height 0.5s ease;
        }

        /* Kivetítés / Kioszk mód */
        body.kiosk-mode .main-nav {
            display: none;
        }
        body.kiosk-mode .main-container {
            height: 100vh;
            padding-top: 2rem;
        }

        .logo-container img {
            height: 54px;
            width: auto;
            border-radius: 0.75rem;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .logo-container img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="flex flex-col">

    <!-- Top Navigation -->
    <nav class="main-nav w-full z-50 px-8 pt-6 flex-shrink-0">
        <div class="max-w-[2000px] mx-auto glass px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <!-- Csak a Logo, név nélkül -->
                <div class="logo-container">
                    <img src="https://i.ibb.co/YTdN2g0d/K-perny-k-p-2026-04-22-170354.png" alt="DSH Logo">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="switchPage('home')" id="nav-home" class="nav-link active px-6 py-2 rounded-xl text-base font-bold">Irányítópult</button>
                <button onclick="switchPage('news')" id="nav-news" class="nav-link px-6 py-2 rounded-xl text-base font-bold">Hírek</button>
                <button onclick="switchPage('finance')" id="nav-finance" class="nav-link px-6 py-2 rounded-xl text-base font-bold">Pénzügyek</button>
            </div>

            <div class="flex items-center gap-6">
                <div class="text-right">
                    <div id="nameday-top" class="text-sm text-blue-400 font-bold uppercase tracking-widest">Betöltés...</div>
                    <div id="current-date-top" class="text-slate-500 text-xs font-medium">...</div>
                </div>
                <!-- Kivetítés gomb -->
                <button onclick="toggleKioskMode()" class="w-12 h-12 rounded-2xl bg-white/5 hover:bg-blue-500/20 flex items-center justify-center text-slate-400 transition-all border border-white/5" title="Kivetítés / Kioszk mód">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-[2000px] mx-auto p-8 main-container overflow-hidden">
        
        <!-- Home / Big Clock Section -->
        <section id="page-home" class="page-content grid grid-cols-12 gap-8">
            <div class="col-span-12 lg:col-span-8 flex flex-col gap-8 h-full">
                <div class="flex-1 glass p-12 flex flex-col justify-center relative overflow-hidden group">
                    <div class="absolute -top-24 -right-24 w-96 h-96 bg-blue-600/10 rounded-full blur-[100px]"></div>
                    
                    <div class="relative z-10 flex flex-col items-center lg:items-start">
                        <div id="big-clock" class="big-clock tabular-nums">00:00</div>
                        <div class="flex items-center gap-4 mt-6">
                            <span id="big-date" class="text-2xl lg:text-4xl font-light text-slate-400">...</span>
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span id="big-day" class="text-2xl lg:text-4xl font-bold text-blue-400 capitalize">...</span>
                        </div>
                    </div>

                    <div class="mt-auto pt-12 flex items-center justify-between border-t border-white/5">
                        <div id="weather-display" class="flex items-center gap-8">
                            <div class="loader"></div>
                        </div>
                        <div class="text-right">
                            <p class="text-slate-500 uppercase tracking-tighter text-sm font-bold">Helyszín</p>
                            <p id="location-name" class="text-xl font-bold">Budapest</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-4 flex flex-col gap-8 h-full overflow-hidden">
                <div class="flex-1 glass p-8 flex flex-col overflow-hidden">
                    <h3 class="text-xl font-bold flex items-center gap-2 mb-6">
                        <i class="fa-solid fa-bolt text-yellow-400"></i> Legfrissebb
                    </h3>
                    <div id="mini-news-container" class="space-y-6 overflow-y-auto no-scrollbar flex-1 pr-2">
                        <div class="loader"></div>
                    </div>
                </div>

                <div class="h-1/3 glass p-8 flex flex-col shrink-0">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-green-400"></i> Piacok
                    </h3>
                    <div id="mini-rates-container" class="grid grid-cols-1 gap-4 flex-1">
                        <div class="h-full bg-white/5 rounded-2xl animate-pulse"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- News Page -->
        <section id="page-news" class="page-content hidden flex flex-col">
            <h2 class="text-5xl font-black mb-8 tracking-tighter">Hírek <span class="text-blue-500">.</span></h2>
            <div id="full-news-container" class="flex-1 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 overflow-y-auto no-scrollbar pr-4">
                <div class="loader"></div>
            </div>
        </section>

        <!-- Finance Page -->
        <section id="page-finance" class="page-content hidden flex flex-col">
            <h2 class="text-5xl font-black mb-8 tracking-tighter">Pénzügyek <span class="text-purple-500">.</span></h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mb-8" id="full-rates-container">
                <div class="h-32 glass animate-pulse"></div>
            </div>
            <div class="flex-1 glass p-12 relative overflow-hidden flex flex-col justify-center">
                <div class="relative z-10">
                    <h3 class="text-4xl font-bold mb-6">Piaci Dinamika</h3>
                    <p class="text-slate-400 text-xl max-w-4xl leading-relaxed">
                        Az adatok az európai és amerikai tőzsdék nyilvános API-jain keresztül frissülnek. A rendszer automatikusan kalkulálja az átváltási rátákat a forinthoz (HUF) képest.
                    </p>
                </div>
                <i class="fa-solid fa-landmark-dome absolute bottom-[-40px] right-[-40px] text-[25vw] opacity-5"></i>
            </div>
        </section>

    </main>

    <button id="exit-kiosk" onclick="toggleKioskMode()" class="fixed bottom-8 right-8 w-12 h-12 glass hidden items-center justify-center text-white/50 hover:text-white z-[100]">
        <i class="fa-solid fa-compress"></i>
    </button>

    <script>
        // State
        let userLocation = { lat: 47.4979, lon: 19.0402, name: 'Budapest' };

        function toggleKioskMode() {
            document.body.classList.toggle('kiosk-mode');
            const exitBtn = document.getElementById('exit-kiosk');
            if (document.body.classList.contains('kiosk-mode')) {
                exitBtn.classList.replace('hidden', 'flex');
            } else {
                exitBtn.classList.replace('flex', 'hidden');
            }
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            const target = document.getElementById(`page-${pageId}`);
            if (target) target.classList.remove('hidden');
            
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const nav = document.getElementById(`nav-${pageId}`);
            if (nav) nav.classList.add('active');
        }

        // Hibatűrő API lekérés wrapper
        async function safeFetch(url, options = {}, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        async function fetchCityName(lat, lon) {
            try {
                const data = await safeFetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const city = data.address.city || data.address.town || data.address.village || "Budapest";
                userLocation.name = city;
                document.getElementById('location-name').textContent = city;
            } catch (e) {
                console.warn("City name fetch failed, using default");
                document.getElementById('location-name').textContent = "Budapest";
            }
        }

        function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLocation.lat = pos.coords.latitude;
                        userLocation.lon = pos.coords.longitude;
                        fetchCityName(userLocation.lat, userLocation.lon);
                        fetchWeather();
                    },
                    () => {
                        document.getElementById('location-name').textContent = "Budapest";
                        fetchWeather();
                    },
                    { timeout: 5000 }
                );
            } else {
                fetchWeather();
            }
        }

        const namedays = { "04-22": "Csilla, Noémi", "04-23": "Béla", "04-24": "György", "04-25": "Márk", "04-26": "Ervin", "04-27": "Zita" };

        function updateTime() {
            const now = new Date();
            const clockStr = now.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('big-clock').textContent = clockStr; 
            
            const dateStr = now.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });
            const dayStr = now.toLocaleDateString('hu-HU', { weekday: 'long' });
            
            document.getElementById('big-date').textContent = dateStr;
            document.getElementById('big-day').textContent = dayStr;
            document.getElementById('current-date-top').textContent = dateStr;

            const key = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            document.getElementById('nameday-top').textContent = "Névnap: " + (namedays[key] || "---");
        }

        async function fetchWeather() {
            try {
                const data = await safeFetch(`https://api.open-meteo.com/v1/forecast?latitude=${userLocation.lat}&longitude=${userLocation.lon}&current_weather=true`);
                const temp = Math.round(data.current_weather.temperature);
                
                document.getElementById('weather-display').innerHTML = `
                    <i class="fa-solid fa-cloud-sun text-6xl text-blue-400"></i>
                    <div>
                        <div class="text-6xl font-black tabular-nums">${temp}°C</div>
                        <div class="text-slate-500 font-bold uppercase text-xs tracking-[0.2em]">Aktuális hőmérséklet</div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('weather-display').innerHTML = `<div class="text-slate-500">Időjárás nem elérhető</div>`;
            }
        }

        async function fetchRates() {
            try {
                const data = await safeFetch('https://open.er-api.com/v6/latest/EUR');
                const huf = data.rates.HUF;
                
                const rates = [
                    { label: 'Euró', code: 'EUR', val: huf.toFixed(1), color: 'text-blue-400' },
                    { label: 'Dollár', code: 'USD', val: (huf / data.rates.USD).toFixed(1), color: 'text-green-400' },
                    { label: 'Font', code: 'GBP', val: (huf / data.rates.GBP).toFixed(1), color: 'text-purple-400' },
                    { label: 'Svájci Frank', code: 'CHF', val: (huf / data.rates.CHF).toFixed(1), color: 'text-red-400' }
                ];

                document.getElementById('mini-rates-container').innerHTML = rates.slice(0, 3).map(r => `
                    <div class="flex justify-between items-center p-5 bg-white/5 rounded-2xl border border-white/5">
                        <span class="font-bold text-slate-500">${r.code} / HUF</span>
                        <span class="text-2xl font-black ${r.color}">${r.val} <span class="text-xs">HUF</span></span>
                    </div>
                `).join('');

                document.getElementById('full-rates-container').innerHTML = rates.map(r => `
                    <div class="glass p-10">
                        <p class="text-xs font-black text-slate-500 uppercase tracking-widest mb-2">${r.label}</p>
                        <div class="text-5xl font-black ${r.color}">${r.val} <span class="text-xl">HUF</span></div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function fetchNews() {
            try {
                const data = await safeFetch('https://api.rss2json.com/v1/api.json?rss_url=https://hvg.hu/rss');
                
                document.getElementById('mini-news-container').innerHTML = data.items.slice(0, 6).map(item => `
                    <div class="group cursor-pointer flex flex-col gap-2 border-b border-white/5 pb-6 last:border-0" onclick="window.open('${item.link}', '_blank')">
                        <h4 class="text-base font-bold group-hover:text-blue-400 transition line-clamp-2 leading-snug">${item.title}</h4>
                        <span class="text-[10px] bg-white/5 px-2 py-1 rounded text-slate-500 font-bold uppercase w-fit">${new Date(item.pubDate).toLocaleTimeString('hu-HU').substring(0,5)}</span>
                    </div>
                `).join('');

                document.getElementById('full-news-container').innerHTML = data.items.slice(0, 15).map(item => `
                    <div class="glass overflow-hidden group cursor-pointer flex flex-col" onclick="window.open('${item.link}', '_blank')">
                        <div class="aspect-[16/9] relative overflow-hidden bg-slate-900">
                            <img src="${item.thumbnail || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=800'}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition duration-700">
                        </div>
                        <div class="p-8 flex-1">
                            <h3 class="text-2xl font-bold mb-4 group-hover:text-blue-400 transition line-clamp-2">${item.title}</h3>
                            <p class="text-slate-400 text-base line-clamp-3">${item.description.replace(/<[^>]*>?/gm, '')}</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTime, 1000);
            updateTime();
            initLocation();
            fetchRates();
            fetchNews();
        });
    </script>
</body>
</html>
